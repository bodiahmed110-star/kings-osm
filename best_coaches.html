<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أباطرة Kings OSM</title>
    <style>
        body {
            background: #0a0a0a;
            color: #fff;
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .royal-container {
            background: linear-gradient(145deg, #151515, #000000);
            border: 2px solid #ffd700;
            padding: 40px 20px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
            max-width: 400px;
            width: 90%;
            position: relative;
            overflow: hidden;
        }

        /* خطوط زينة ذهبية */
        .royal-container::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; height: 5px;
            background: linear-gradient(90deg, transparent, #ffd700, transparent);
        }

        h1 {
            color: #ffd700;
            font-size: 26px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 40px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        .year-card {
            background: rgba(255, 255, 255, 0.05);
            margin: 15px 0;
            padding: 20px;
            border-radius: 15px;
            border-left: 4px solid #ffd700;
            transition: 0.4s ease;
            cursor: pointer;
        }

        .year-card:hover {
            background: rgba(255, 215, 0, 0.1);
            transform: translateX(-10px);
            box-shadow: 5px 5px 15px rgba(0,0,0,0.5);
        }

        .year-label {
            display: block;
            color: #ffd700;
            font-size: 14px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .coach-name {
            font-size: 22px;
            font-weight: bold;
            display: block;
        }

        .status-badge {
            display: inline-block;
            background: #ffd700;
            color: #000;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 12px;
            margin-top: 10px;
            font-weight: bold;
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: #888;
            text-decoration: none;
            font-size: 14px;
            border-bottom: 1px solid transparent;
            transition: 0.3s;
        }

        .back-link:hover {
            color: #ffd700;
            border-bottom-color: #ffd700;
        }
    </style>
</head>
<body>

    <div class="royal-container">
        <h1>👑 ملوك العصور</h1>

        <div class="year-card">
            <span class="year-label">2024</span>
            <span class="coach-name">المدرب منصف</span>
            <span class="status-badge">بطل العام</span>
        </div>

        <div class="year-card">
            <span class="year-label">2025</span>
            <span class="coach-name">المدرب عبدو طارق</span>
            <span class="status-badge">بطل العام</span>
        </div>

        <div class="year-card" style="opacity: 0.6; border-left-color: #555;">
            <span class="year-label">2026</span>
            <span class="coach-name">؟؟؟؟؟؟؟؟</span>
            <span class="status-badge" style="background: #555;">في الانتظار</span>
        </div>

        <a href="index.html" class="back-link">🔙 العودة لعرين الأبطال</a>
    </div>

</body>
</html>
